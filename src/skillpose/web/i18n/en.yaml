conditions:
  title: Conditions
  intro: "Postings name conditions such as a driving licence or travel. A CV cannot show them, so you answer them here, once. The answers apply to every CV and stay in your database; they never go to Claude. A field you leave empty counts as not answered; that condition is then not checked, unless the hint of the question says otherwise. A must condition that you do not meet is a knockout: the posting goes to tier 3."
  intro_locked: "Postings name conditions such as a driving licence or travel. A CV cannot show them, so they are answered once in the profile, for every CV of the database. The answers never go to Claude. A must condition that is not met is a knockout: the posting goes to tier 3. Without an API key the answers can only be read."
  unset: Not answered
  answer_yes: "Yes"
  answer_no: "No"
  driving_licence_b: Do you have a driving licence B?
  driving_licence_b_hint: "Yes: met. No: a posting that asks for it as a must is a knockout."
  travel_share_max: Up to what share of your working time can you travel, in per cent?
  travel_share_max_hint: "A whole number from 0 to 100; 0 means no travel. A posting that asks for more travel than you name, as a must, is a knockout. If it names no number at all, the app counts {default} %. If it names a number without a per cent sign (for example “2 days a week”), the app does not check the travel."
  shift_work: Can you work in shifts?
  shift_work_hint: "Yes: met. No: a posting that asks for shift work as a must is a knockout."
  commute_km_max: How far can you commute to work at most, in kilometres?
  commute_km_max_hint: "A whole number of kilometres. The app does not calculate distances yet. A number alone is enough: every place of work that a posting names then counts as met, unless you have to work exclusively from home. The number only appears as the reason at the posting."
  remote_only: Do you have to work exclusively from home – never on site?
  remote_only_hint: "Answer Yes only if you can never work on site. Yes: every place of work that a posting names (for example “location Linz”) is then not met. If it is a must, that is a knockout. No: work on site is possible, the place of work is met."
  full_time: Can you work full-time?
  full_time_hint: "Yes: met. No: a posting that asks for full-time as a must is a knockout. A posting that names part-time is always met."
  notes: Notes
  notes_hint: Only for you. Not used for matching, never sent to Claude.
  up_to_travel_share_max: "up to {count} %"
  up_to_commute_km_max: "up to {count} km"
  save: Save answers
  saving: Saving …
  error_travel_share_max: Enter a whole number from 0 to 100.
  error_commute_km_max: Enter a whole number of kilometres, 0 or more.
  error_notes: "At most {limit} characters."
  key:
    driving_licence_b: Driving licence B
    travel: Travel
    shift_work: Shift work
    location: Place of work
    working_time: Working time

