conditions:
  title: Rahmenbedingungen
  intro: "Inserate nennen Bedingungen, zum Beispiel Führerschein oder Reisen. Ein Lebenslauf zeigt sie nicht. Du beantwortest sie hier einmal. Die Antworten gelten für jeden Lebenslauf und bleiben in deiner Datenbank; sie gehen nie an Claude. Ein leeres Feld zählt als nicht beantwortet; diese Bedingung wird dann nicht geprüft, außer es steht anders bei der Frage. Eine Muss-Bedingung, die du nicht erfüllst, ist ein K.-o.: Das Inserat kommt auf Stufe 3."
  intro_locked: "Inserate nennen Bedingungen, zum Beispiel Führerschein oder Reisen. Ein Lebenslauf zeigt sie nicht. Darum werden sie einmal im Profil beantwortet, für jeden Lebenslauf der Datenbank. Die Antworten gehen nie an Claude. Eine Muss-Bedingung, die nicht erfüllt ist, ist ein K.-o.: Das Inserat kommt auf Stufe 3. Ohne API-Schlüssel kann man die Antworten nur lesen."
  unset: Nicht beantwortet
  answer_yes: "Ja"
  answer_no: "Nein"
  driving_licence_b: Hast du den Führerschein B?
  driving_licence_b_hint: "Ja: erfüllt. Nein: Ein Inserat, das ihn als Muss verlangt, ist ein K.-o."
  travel_share_max: Bis zu wie viel Prozent deiner Arbeitszeit kannst du reisen?
  travel_share_max_hint: "Ganze Zahl von 0 bis 100; 0 heißt: keine Reisen. Ein Inserat, das als Muss mehr Reisen verlangt, als du nennst, ist ein K.-o. Steht im Inserat gar keine Zahl, rechnet die App mit {default} %. Steht dort eine Zahl ohne Prozent (zum Beispiel „2 Tage pro Woche“), prüft die App die Reisen nicht."
  shift_work: Kannst du in Schichten arbeiten?
  shift_work_hint: "Ja: erfüllt. Nein: Ein Inserat, das Schichtarbeit als Muss verlangt, ist ein K.-o."
  commute_km_max: Wie weit kannst du höchstens zur Arbeit pendeln (in Kilometern)?
  commute_km_max_hint: "Ganze Zahl in Kilometern. Die App rechnet noch keine Entfernungen. Schon mit einer Zahl gilt jeder Arbeitsort eines Inserats als erfüllt, es sei denn, du musst ausschließlich von zu Hause arbeiten. Die Zahl steht nur als Grund beim Inserat."
  remote_only: Musst du ausschließlich von zu Hause arbeiten – nie vor Ort?
  remote_only_hint: "Antworte nur mit Ja, wenn du nie vor Ort arbeiten kannst. Ja: Jeder Arbeitsort, den ein Inserat nennt (zum Beispiel „Standort Linz“), ist dann nicht erfüllt. Ist er ein Muss, ist das ein K.-o. Nein: Arbeit vor Ort ist möglich, der Arbeitsort ist erfüllt."
  full_time: Kannst du in Vollzeit arbeiten?
  full_time_hint: "Ja: erfüllt. Nein: Ein Inserat, das Vollzeit als Muss verlangt, ist ein K.-o. Nennt ein Inserat Teilzeit, ist es immer erfüllt."
  notes: Notizen
  notes_hint: Nur für dich. Zählt nicht beim Abgleich und geht nie an Claude.
  up_to_travel_share_max: "bis {count} %"
  up_to_commute_km_max: "bis {count} km"
  save: Antworten speichern
  saving: Speichern …
  error_travel_share_max: Bitte eine ganze Zahl von 0 bis 100.
  error_commute_km_max: Bitte eine ganze Zahl in Kilometern, 0 oder mehr.
  error_notes: "Höchstens {limit} Zeichen."
  key:
    driving_licence_b: Führerschein B
    travel: Reisebereitschaft
    shift_work: Schichtarbeit
    location: Arbeitsort
    working_time: Arbeitszeit

