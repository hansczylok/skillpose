    role_tiers:
      # start table 3 for rpa: 04, 05 and 21 are tier 2 (UiPath, Power Automate, Power Apps distant to VBA or Power BI)
      test_automation: 3           # 01, 03, 16 years gap; 17, 18 over 26 weeks; only 02 tier 2 -> 1/6
      rpa_process_automation: 2    # 04, 05, 21 tier 2 (8 to 24 weeks of gaps); 19, 20 years gap -> 3/5
      data_analysis_bi: 1          # 06, 22, 23, 24 tier 1 (Power BI, SQL, data modelling met); 07, 08 tier 2 -> 4/6
