# Expected results of the skillpose gold set. Keys are file names without extension.
# cvs: language of the CV, skills that must be extracted, traps that must not, expected best evidence strength for
# unambiguous cases, the expected status of single requirements (match_status) and the tier per role family with at
# least 5 postings (role_tiers; the default minimum is 1 posting since 2026-10-24, so the market view now has more
# families than these 12 tiers, which were fixed when the minimum was 5).
# postings: role family, seniority, must and nice requirements (skill ids or names that resolve in the vocabulary).
# conditions: invented answers to the conditions of postings (driving licence, travel, ...) for the demo. The demo is
# one database, so its persons share one set, as every database has one. Only `skillpose demo build` uses them; the
# eval matches with every condition unanswered, so they change no expected value here.
#
# match_status and role_tiers follow from the rules of core/matching.py and core/market.py (defaults.yaml), applied for
# the year 2026 to the expected skills (levels, years and evidence as the CV states them; the degree of the CV with an
# id that starts with bachelor_, so it meets university_degree) and to the expected requirements (levels and years as
# the posting states them). A gap with a distant relation counts 4 weeks (weeks), a gap without one 12 weeks
# (months); tier 2 allows at most 26 weeks of must gaps. A role tier comment names the postings by their number.
# Step 3b relations assumed (target <- skill of the person: relation); every pair not listed is none:
#   airflow <- python: distant
#   api_testing <- postman: close
#   cpp <- java: close
#   csharp <- cpp: close
#   csharp <- java: close
#   cypress <- power_automate: distant
#   cypress <- selenium: close
#   data_modeling <- sql: distant
#   data_visualization <- excel: distant
#   data_warehousing <- data_modeling: close
#   data_warehousing <- sql: distant
#   databricks <- python: distant
#   databricks <- sql: distant
#   dbt <- sql: close
#   etl <- data_modeling: distant
#   etl <- sql: distant
#   github_actions <- docker: distant
#   github_actions <- jenkins: close
#   gitlab_ci <- docker: distant
#   gitlab_ci <- jenkins: close
#   java <- cpp: close
#   java <- python: close
#   jenkins <- docker: distant
#   kafka <- python: distant
#   kubernetes <- docker: close
#   machine_learning <- python: distant
#   mlops <- docker: distant
#   playwright <- power_automate: distant
#   playwright <- python: distant
#   playwright <- selenium: close
#   power_apps <- power_automate: close
#   power_apps <- power_bi: distant
#   power_automate <- power_bi: distant
#   power_automate <- selenium: distant
#   power_automate <- test_automation: distant
#   power_automate <- vba: distant
#   power_bi <- excel: distant
#   power_bi <- power_automate: distant
#   process_modeling <- data_modeling: distant
#   process_modeling <- rpa: distant
#   pytest <- python: close
#   pytest <- testng: close
#   python <- java: close
#   pytorch <- python: distant
#   rpa <- test_automation: distant
#   rpa <- vba: distant
#   sap_fi_co <- sap: close
#   sap_mm <- sap: close
#   sap_s4hana <- sap: close
#   scikit_learn <- python: distant
#   selenium <- power_automate: distant
#   selenium <- python: distant
#   sharepoint <- confluence: close
#   spark <- python: distant
#   sql <- excel: distant
#   sql <- python: distant
#   sql_server <- sql: close
#   ssis <- sql: distant
#   statistics <- data_modeling: distant
#   statistics <- data_visualization: distant
#   tableau <- power_bi: close
#   test_automation <- rpa: distant
#   test_management <- test_automation: close
#   tosca <- power_automate: distant
#   tosca <- selenium: close
#   typescript <- java: close
#   typescript <- python: close
#   uipath <- power_automate: close
#   uipath <- selenium: distant
#   uipath <- test_automation: distant
#   uipath <- vba: distant

